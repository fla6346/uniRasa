# rules.yml
version: "3.1"

rules:
  - rule: Intento de crear evento → sin permiso
    steps:
    - intent: agregar_evento
    - action: action_no_permiso_crear_evento

  - rule: Saludar
    steps:
      - intent: saludar
      - action: utter_saludar

  - rule: Despedirse
    steps:
      - intent: despedir
      - action: utter_despedir