version: "3.1"

stories:

# Historia 1: Camino feliz - consulta de eventos
- story: Camino feliz - consulta de eventos
  steps:
    - intent: saludar
    - action: utter_saludar
    - intent: consultar_eventos
    - action: action_consultar_eventos
    - intent: despedir
    - action: utter_despedir

# Historia 2: Crear un evento (flujo con formulario)
- story: Crear un nuevo evento
  steps:
    - intent: agregar_evento
    - action: crear_evento_form
    - active_loop: crear_evento_form
    # Aquí el usuario responde a las preguntas del formulario
    - intent: inform
      entities:
        - nombre_evento: "Taller de IA"
    - action: crear_evento_form
    - intent: inform
      entities:
        - fecha: "2026-04-10"
    - action: crear_evento_form
    - intent: inform
      entities:
        - hora: "15:00"
    - action: crear_evento_form
    - intent: inform
      entities:
        - lugar: "Aula Magna"
    - action: crear_evento_form
    - active_loop: null
    - action: action_crear_evento
    - intent: despedir
    - action: utter_despedir

# Historia 5: Conversación corta - solo saludo y despedida
