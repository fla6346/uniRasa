    - [15 de octubre](fecha)
    - [mañana](fecha)
    - [hoy](fecha)
    - a las [14:00](hora)
    - [3 pm](hora)
    - [10:30 am](hora)
    - en el [Aula Magna](lugar)
    - en el [laboratorio B2](lugar)
    - [auditorio principal](lugar)
    - mi correo es [usuario@uft.edu](email)