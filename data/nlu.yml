version: "3.1"
nlu:
- intent: saludar
  examples: |
    - hola
    - buenos dias
    - hey

- intent: despedir
  examples: |
    - adios
    - hasta luego

- intent: consultar_eventos
  examples: |
    - ¿Qué eventos hay programados?
    - Muéstrame los próximos eventos
    - ¿Hay algo para el viernes?
    - ¿Qué eventos hay en octubre?
    - quiero ver los eventos
    - ver eventos
    - dime que eventos hay
    - lista de eventos
    - consultar eventos
    - quiero ver

- intent: agregar_evento
  examples: |
    - Quiero agregar un nuevo evento
    - Necesito crear un evento
    - Agendar un evento
    - Registrar un nuevo evento
    - Quiero programar algo
    - Agenda la [Conferencia de IA](nombre_evento) para el [15 de diciembre](fecha)
    - Añade un evento: [Reunión del club de debate](nombre_evento)
    - Agrega [Feria de Ciencias](nombre_evento) para [mañana](fecha) a las [3 pm](hora)
    - Nuevo evento: [Taller de Robótica](nombre_evento) en el [laboratorio B2](lugar)
