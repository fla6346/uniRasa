    - Crear evento [Charla de Egresados](nombre_evento) en el [auditorio principal](lugar)
- intent: vincular_cuenta
  examples: |
    - quiero vincular mi cuenta
    - vincular con telegram
    - recibir notificaciones
- intent: inform
  examples: |
    - [Taller de IA](nombre_evento)
    - [Reunión académica](nombre_evento)
    - [Feria de Ciencias](nombre_evento)
