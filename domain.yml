version: "3.1"

intents:
  - saludar
  - despedir
  - consultar_eventos
  - agregar_evento

responses:
  utter_saludar:
    - text: "¡Hola! Soy tu asistente de eventos universitarios."
  utter_despedir:
    - text: "¡Hasta luego!"

actions:
  - action_consultar_eventos
  - action_no_permiso_crear_evento
forms:
  crear_evento_form:
    required_slots:
      - nombre_evento
      - fecha
      - hora
      - lugar
entities:
  - nombre_evento
  - fecha
  - hora
  - lugar
session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true