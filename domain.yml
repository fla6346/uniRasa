version: "3.1"
slots:
  nombre_evento:
    type: text
    influence_conversation: true
    mappings:
      - type: from_text
  
  fecha:
    type: text
    influence_conversation: true
    mappings:
      - type: from_text
  
  hora:
    type: text
    influence_conversation: true
    mappings:
      - type: from_text
  
  lugar:
    type: text
    influence_conversation: true
    mappings:
      - type: from_text
intents:
  - saludar
  - despedir
  - consultar_eventos
  - agregar_evento
  - vincular_cuenta
  - inform

responses:
  utter_saludar:
    - text: "¡Hola! Soy tu asistente de eventos universitarios."
  utter_despedir:
    - text: "¡Hasta luego!"

actions:
  - action_consultar_eventos
  - action_no_permiso_crear_evento
  - action_consultar_eventos
  - action_no_permiso_crear_evento
  - action_guardar_evento 
forms:
  crear_evento_form:
    required_slots:
      - nombre_evento
      - fecha
      - hora
      - lugar
entities:
  - nombre_evento
  - fecha
  - hora
  - lugar
session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true